name: Release (Windows installer)

# Publishes the Windows installer as a GitHub Release asset, downloadable
# without logging in and without expiry (unlike workflow artifacts).
#  - Bump "version" in package.json and push to main → publishes v<version>
#    if that release does not exist yet (otherwise nothing is rebuilt).
#  - Or push a tag like v0.4.0, or run it by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload the installer

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Is there a new version to publish?
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.c.outputs.publish }}
      tag: ${{ steps.c.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "$tag" ]; then
            echo "::error::La etiqueta ${{ github.ref_name }} no coincide con package.json ($version)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" != "tag" ]; then
            echo "La release $tag ya existe: no se vuelve a publicar."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Build and publish Windows installer
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E
        run: npx playwright test
      - name: Build NSIS installer (unsigned)
        run: npx electron-builder --win --x64 --publish never
      - name: Smoke test of the packaged app (fuses + asar integrity)
        run: node scripts/smoke-packaged.mjs release/win-unpacked/InvestorBrowser.exe

      # Microsoft Store package. Only built when the Partner Center identity is configured as
      # repository VARIABLES (not secrets: these values are public in the Store listing anyway).
      # Unsigned on purpose: Microsoft signs it when the submission is certified.
      - name: Microsoft Store package (.appx, for Partner Center)
        if: vars.MSSTORE_IDENTITY_NAME != '' && vars.MSSTORE_PUBLISHER != '' && vars.MSSTORE_PUBLISHER_DISPLAY_NAME != ''
        env:
          ID: ${{ vars.MSSTORE_IDENTITY_NAME }}
          PUB: ${{ vars.MSSTORE_PUBLISHER }}
          PUBNAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        shell: pwsh
        run: npx electron-builder --win appx --x64 --publish never "-c.appx.identityName=$env:ID" "-c.appx.publisher=$env:PUB" "-c.appx.publisherDisplayName=$env:PUBNAME"

      - name: Checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem release/*.exe, release/*.appx -ErrorAction SilentlyContinue
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ needs.check.outputs.tag }}"
          $exe = (Get-ChildItem release/*.exe | Select-Object -First 1).FullName
          $assets = @($exe, "release/SHA256SUMS.txt") + @(Get-ChildItem release/*.appx -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $notes = @"
          Instalador para **Windows 10/11 (64 bits)**.

          1. Descarga ``$(Split-Path $exe -Leaf)`` (más abajo, en *Assets*).
          2. Ábrelo. Como el instalador **todavía no está firmado digitalmente**, Windows SmartScreen mostrará un aviso: pulsa **Más información → Ejecutar de todas formas**.
          3. Opcional: comprueba la huella con ``Get-FileHash <archivo> -Algorithm SHA256`` y compárala con ``SHA256SUMS.txt``.

          El archivo ``.appx`` (si aparece) es **solo para subirlo a Microsoft Store**; no se instala con doble clic. Cuando la app esté publicada en la Store, instálala desde allí: Microsoft la firma y no aparece ningún aviso.

          Tus datos se guardan en ``%APPDATA%\Investor Browser`` y se conservan al desinstalar.

          Cambios: ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          "@
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $assets --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Investor Browser $tag" --notes $notes --prerelease
          }
